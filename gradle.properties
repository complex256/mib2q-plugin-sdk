org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g

# Machine-local paths are read in build-logic (mibsdk.build.Toolchain). None has a default under the home directory.
# Set them with -P or in ~/.gradle/gradle.properties (see README.md#toolchain):
#   mibsdk.jdk8Home           optional: a JDK 8 home for forked javac, Retrolambda and Retrotranslator. Without it
#                             Gradle's toolchain detection finds (or downloads) a JDK 8
#   mibsdk.stockLsdJar        optional for plugin builds: jxe2jar's lsd.jar. Without it linkCheck uses the car class
#                             library list bundled in build-logic. Needed to build adapter-hqc and dist, and to
#                             regenerate that list
#   mibsdk.stockDsiTracerJar  stock DSITracer.jar; needed to build adapter-hqc and dist
#   mibsdk.mibpkg             host mibpkg binary that builds .mpk packages (default: `mibpkg` on PATH);
#                             cargo build --release in the mibpkg repo
# Stock jars are never committed.

# Version of the SDK package (dist/build/dist/mibsdk-<version>.mpk).
mibsdk.version=0.5.0
