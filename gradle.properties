org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g

# Machine-local paths are resolved in build-logic (mibsdk.build.Toolchain) when not set here:
#   mibsdk.jdk8Home         JDK 8 home used for forked javac, Retrolambda and Retrotranslator
#   mibsdk.stockLsdJar      jxe2jar's lsd.jar (source of the car JCL)
#   mibsdk.stockDsiTracerJar  stock DSITracer.jar
# Override them with -P or in ~/.gradle/gradle.properties. Stock jars are never committed.
