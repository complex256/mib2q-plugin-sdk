# Where Gradle finds the mibsdk artifacts.
#
# Empty means the published repository:
#   https://complex256.github.io/mib2q-plugin-sdk/maven
#
# To build against a local SDK checkout instead, run `./gradlew publishLocal` there and set:
#   mibsdk.repo=file:///absolute/path/to/mib2q-plugin-sdk/build/repo
mibsdk.repo=

# Optional: the host mibpkg binary, needed only for `mibpkgPackage`.
# mibsdk.mibpkg=/path/to/mibpkg

# Optional: a specific JDK 8. Without it Gradle's toolchain detection finds or downloads one.
# mibsdk.jdk8Home=/path/to/jdk8
